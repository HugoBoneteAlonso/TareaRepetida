name: Java CI

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - master
      - feature/tarea-05-tests

jobs:
  build:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Build and test
        run: mvn clean verify